[package]
name = "dead-quarantine-web"
version = "0.1.0"
description = "Dead Quarantine II Web"

[dependencies]
"wasmer/static-web-server" = "^1"

[[command]]
name = "serve"
module = "wasmer/static-web-server:web-server"
runner = "wasi"

[command.annotations.wasi]
env = { "SERVER_ROOT" = "public" }

[[command]]
name = "script"
module = "wasmer/static-web-server:web-server"
runner = "wasi"